query ProductQuery($id: ID!, $country: CountryCode!, $language: LanguageCode!) @inContext(country: $country, language: $language) {
    product(id: $id) {
        id
        title
        vendor
        handle
        featuredImage {
            altText
            url
            thumbhash
        }
        productType
        priceRange {
            maxVariantPrice {
                amount
                currencyCode
            }
            minVariantPrice {
                amount
                currencyCode
            }
        }
        description
        images(first: 20) {
            nodes {
                altText
                url
                thumbhash
            }
        }
        variants(first: 10) {
            nodes {
                availableForSale
                currentlyNotInStock
                id
                quantityAvailable
                title
                image {
                    altText
                    url
                    thumbhash
                }
                price {
                    amount
                    currencyCode
                }
            }
        }
        metafields(identifiers: [{ namespace: "reviews", key: "items" }]) {
            key
            namespace
            value
            type
            references(first: 50) {
                edges {
                    node {
                        ... on Metaobject {
                            id
                            customerName: field(key: "customer_name") { value }
                            rating: field(key: "rating") { value }
                            reviewTitle: field(key: "title") { value }
                            body: field(key: "body") { value }
                            createdAt: field(key: "created_at") { value }
                            approved: field(key: "approved") { value }
                        }
                    }
                }
            }
        }
    }
}
