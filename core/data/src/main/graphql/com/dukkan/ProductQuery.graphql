query ProductQuery($id: ID) {
    product(id: $id) {
        id
        title
        handle
        featuredImage {
            url
        }
        productType
        priceRange {
            maxVariantPrice {
                amount
                currencyCode
            }
            minVariantPrice {
                amount
                currencyCode
            }
        }
        description
        images {
            nodes {
                altText
                id
                src
                thumbhash
            }
        }
        variants {
            nodes {
                availableForSale
                currentlyNotInStock
                id
                quantityAvailable
                title
                image {
                    altText
                    id
                    src
                    thumbhash
                }
                price {
                    amount
                    currencyCode
                }
            }
        }
    }
}
