query SearchProducts(
    $query: String! = "sneaker",
    $first: Int! = 20,
    $after: String,
    $filters: [ProductFilter!]
) {
    search(
        query: $query,
        first: $first,
        after: $after,
        types: [PRODUCT],
        productFilters: $filters
    ) {
        totalCount
        pageInfo {
            hasNextPage
            endCursor
        }
        edges {
            node {
                ... on Product {
                    id
                    title
                    vendor
                    productType
                    availableForSale
                    priceRange {
                        minVariantPrice {
                            amount
                            currencyCode
                        }
                    }
                    featuredImage {
                        url
                        altText
                    }
                    variants(first: 5) {
                        nodes {
                            id
                            title
                            availableForSale
                            quantityAvailable
                            price {
                                amount
                                currencyCode
                            }
                        }
                    }
                    metafields(identifiers: [{ namespace: "reviews", key: "items" }]) {
                        key
                        namespace
                        value
                        type
                        references(first: 50) {
                            edges {
                                node {
                                    ... on Metaobject {
                                        id
                                        rating: field(key: "rating") { value }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}
