query Products {
    products(first: 10) {
        edges {
            node {
                id
                handle
                title
                featuredImage {
                    url
                    thumbhash
                }
                priceRange {
                    maxVariantPrice {
                        amount
                        currencyCode
                    }
                    minVariantPrice {
                        amount
                        currencyCode
                    }
                }
            }
        }
    }
}
