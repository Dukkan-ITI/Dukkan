query Products($first: Int = 10, $after: String, $country: CountryCode!, $language: LanguageCode!) @inContext(country: $country, language: $language) {
    products(first: $first, after: $after) {
        pageInfo {
            hasNextPage
            endCursor
        }
        edges {
            node {
                id
                handle
                title
                productType
                description
                featuredImage {
                    url
                    thumbhash
                }
                priceRange {
                    maxVariantPrice { amount currencyCode }
                    minVariantPrice { amount currencyCode }
                }
                metafields(identifiers: [{ namespace: "reviews", key: "items" }]) {
                    key
                    namespace
                    value
                    type
                    references(first: 50) {
                        edges {
                            node {
                                ... on Metaobject {
                                    id
                                    rating: field(key: "rating") { value }
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}