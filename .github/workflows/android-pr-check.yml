name: Android Pull Request Check

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 21
  GRADLE_OPTS: -Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

jobs:
  android-build:
    name: Android Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS files
        run: git lfs pull

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradlew Permission
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Inject secrets into gradle.properties
        run: |
          cat <<EOF > gradle.properties
          shopifyStorefrontToken=${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}
          shopifyAdminToken=${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          android.disallowKotlinSourceSets=false
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=true
          EOF

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Validate google-services.json
        run: jq empty app/google-services.json

      - name: Build Android App
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon --no-build-cache

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

      - name: Upload Android APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
